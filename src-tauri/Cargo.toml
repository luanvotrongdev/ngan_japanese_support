[package]
name = "ngan-japanese-support"
version = "0.1.0"
description = "Ngan Japanese Support desktop app"
authors = ["Ngan"]
edition = "2021"

[lib]
name = "ngan_japanese_support_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
